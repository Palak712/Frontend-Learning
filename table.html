<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tag</title>
</head>
<body>
    <h3>This is a heading tag</h3>
    <table border="1">
        <thead>
        <tr>
            <th>name</th>
            <th>roll num</th>
            <th>section</th>
        </tr>
        </thead>
        <tbody>
            <tr>
                <td>alak</td>
                <td>00</td>
                <!-- <td rowspan="3" colspan="2">A</td> -->
                <td>A</td>
            </tr>
            <tr>
                <td>palak</td>
                <td>100</td>
                <td>B</td>
            </tr>
            <tr>
                <td>pala</td>
                <td>10</td>
                <td>C</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
