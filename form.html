<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tag</title>
</head>
<body>
    <h3>This is a form tag.</h3>
    <form action="submit" method="post">
        <label for="fullname">Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="enter your name" required/>
        <br/><br/>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="enter your email" required/> <br/> <br/>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="enter your password" required/><br/> <br/>
        <div>Gender using radio: </div>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender" value="male" required/>
        <label for="female">Female</label>
        <input type="radio" id="female" name="gender" value="female"/>
        <label for="others">Others</label>
        <input type="radio" id="others" name="gender" value="others"/>
        <br/><br/>
        <div>Hobbies using checkbox:</div>
        <label for="singing">Singing</label>
        <input type="checkbox" id="singing" name="hobbies" value="singing"/>
        <label for="reading">Reading</label>
        <input type="checkbox" id="reading" name="hobbies" value="reading"/> 
        <label for="jumping">Jumping</label>
        <input type="checkbox" id="jumping" name="hobbies" value="jumping"/>
        <br/><br/>
        <div>Languages using dropdown: </div>
            <select name="languages" id="languages">
                <option value="select">Select</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="java">Java</option>
            </select>
        <br/><br/>
        <label for="age">Age using number:</label>
        <input type="number" id="age" name="age" min="18" max="100" placeholder="enter your age" required/>
        <br/><br/>
        <label for="resume">Resume using file:</label>
        <input type="file" id="resume" name="resume" required/>
        <br/><br/>
        <label for="number">Mobile number using tel:+91</label>
        <input type=tel" id="number" name="number" placeholder="enter your mobile number" pattern="[0-9]{10}" required/>
        <br/><br/>
        <label for="date">Date of Birth:</label>
        <input type="date" id="date" name="date" required/>
        <br/><br/>
        <label for="saptah">Week :</label>
        <input type="week" id="saptah" name="hapta" />
        <br/><br/>
        <label for="mahina">Month:</label>
        <input type="month" id="mahina" name="month" />
        <br/><br/>
        <label for="smy">Time for the class:</label>
        <input type="time" id="smy" name="class" required/>
        <br/><br/>
        <label for="range">Range of water:</label>
        <input type="range" id="range" name="range" required/>
        <br/><br/>
        <label for="link">Link of google:</label>
        <input type="url" id="link" name="google" required/>
        <br/><br/>
        <label for="laptop">Color of laptop:</label>
        <input type="color" id="laptop" name="rang" required/>
        <br/><br/>
        <label for="feedback">Feedback:</label>
        <br/>
        <textarea id="feedback" name="message" rows="2" cols="20"  placeholder="enter a feedback" required></textarea>
        <br/>
        <input type="submit"/>
        <input type="reset"/>
    </form>
</body>
</html>
